databases:
  - name: vehicle-maintenance-db
    databaseName: vehicle_maintenance
    user: db_user
    plan: free

services:
  - type: web
    name: vehicle-maintenance-backend
    env: node
    plan: free
    buildCommand: npm install --prefix backend && npm run build --prefix backend && cd backend && npx prisma db push --accept-data-loss && npx prisma db seed
    startCommand: cd backend && npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vehicle-maintenance-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: vehicle-maintenance-frontend
    env: static
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: vehicle-maintenance-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
