services:
  - type: web
    name: vehicle-backend
    env: node
    region: oregon
    plan: free
    healthCheckPath: /health
    buildCommand: cd backend && npm install && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma migrate deploy && npm run db:seed && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vehicle-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: vehicle-frontend
    env: static
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: vehicle-backend
          property: url
    # SPA rewrite: qualquer rota profunda (/vehicle/:id) serve o index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: vehicle-db
    region: oregon
    databaseName: vehicle
    user: vehicle
